; PlatformIO Project Configuration — wifi-signal-scanner
; ESP32 WiFi signal strength scanner with ST7789 TFT display

[env:esp32dev]
; Pinned deliberately. An unpinned "espressif32" drifts as new releases land --
; this project silently moved to 7.0.1 -- which is a poor property for anything
; published, since a clone months from now would build against something the
; author never tested. ^6.5.0 matches the version this firmware was verified on
; hardware with.
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Serial port: PlatformIO auto-detects by default. Uncomment and set these
; only if it picks the wrong one (e.g. COM5 on Windows, /dev/ttyUSB0 on Linux).
; upload_port   = COM5
; monitor_port  = COM5

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    ; Captive-portal WiFi provisioning: the device raises its own AP, the user
    ; picks a network from a scanned list and types the password in a browser,
    ; and it's persisted to NVS. Replaces the hardcoded credentials this
    ; project previously used with WiFiMulti.
    tzapu/WiFiManager @ ^2.0.17
